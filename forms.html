<main>
    <h1>Формы HTML</h1>

    <h2>Форма обратной связи</h2>

    <form action="https://httpbin.org/post" method="post">
        <p>
            <label for="surname">Фамилия:</label>
            <input type="text" id="surname" name="surname" required>
        </p>

        <p>
            <label for="firstname">Имя:</label>
            <input type="text" id="firstname" name="firstname" required>
        </p>

        <p>
            <label for="group">Группа:</label>
            <input type="text" id="group" name="group" required>
        </p>

        <p>
            <label for="phone">Телефон:</label>
            <input type="tel" id="phone" name="phone" required>
        </p>

        <p>
            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="send_date">Дата отправки:</label>
            <input type="date" id="send_date" name="send_date" required>
        </p>

        <button type="submit">Отправить данные</button>
    </form>

    <hr>

    <h2>Форма заказа товара</h2>

    <form action="https://httpbin.org/post" method="post">
        <p>
            <label for="product">Название товара:</label>
            <input type="text" id="product" name="product" value="Фигурка R2-D2" required>
        </p>

        <p>
            <label for="quantity">Количество:</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>
        </p>

        <p>Способ доставки:</p>
        <label>
            <input type="radio" name="delivery" value="courier" checked>
            Курьер
        </label>
        <label>
            <input type="radio" name="delivery" value="pickup">
            Самовывоз
        </label>

        <p>Дополнительные услуги:</p>
        <label>
            <input type="checkbox" name="gift_wrap" value="yes">
            Подарочная упаковка
        </label>

        <p>
            <label for="order_date">Дата заказа:</label>
            <input type="date" id="order_date" name="order_date" required>
        </p>

        <p>
            <label for="password">Пароль подтверждения:</label>
            <input type="password" id="password" name="password" required>
        </p>

        <input type="hidden" name="form_type" value="order">

        <p>
            <button type="submit">Оформить заказ</button>
        </p>
    </form>
</main>
